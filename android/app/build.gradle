apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystorePath = System.getenv("SONICSOUND_KEYSTORE") ?: localProperties.getProperty("sonicsound.keystore")
def keystorePassword = System.getenv("SONICSOUND_KEYSTORE_PASSWORD") ?: localProperties.getProperty("sonicsound.keystorePassword")
def keyAlias = System.getenv("SONICSOUND_KEY_ALIAS") ?: localProperties.getProperty("sonicsound.keyAlias", "releasekey")
def keyPassword = System.getenv("SONICSOUND_KEY_PASSWORD") ?: localProperties.getProperty("sonicsound.keyPassword")
def hasReleaseSigning = keystorePath != null && keystorePassword != null && keyPassword != null

// Single source of truth: root package.json
def packageJson = new groovy.json.JsonSlurper().parseText(
    rootProject.file("../package.json").getText("UTF-8")
)
def versionParts = (packageJson.version as String).tokenize(".")
def appVersionCode =
    (versionParts[0] as int) * 10000 +
    (versionParts[1] as int) * 100 +
    (versionParts.size() > 2 ? (versionParts[2] as int) : 0)
// Shield Pro / modern devices are arm64. Override with -Pabis=armeabi-v7a,arm64-v8a if needed.
def abiFiltersList = (project.findProperty("abis") ?: "arm64-v8a")
    .split(",")
    .collect { it.trim() }
    .findAll { it }

android {
    namespace "app.sonicsound"
    compileSdk rootProject.ext.compileSdkVersion

    compileOptions{
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "app.sonicsound"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName packageJson.version
        ndk {
            // Default arm64-only keeps Shield installs small; libvlc-all otherwise pulls every ABI.
            abiFilters(*abiFiltersList)
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"${System.getenv("SPOTIFY_CLIENT_ID") ?: localProperties.getProperty("spotify.clientId", "")}\""
        buildConfigField "String", "SPOTIFY_CLIENT_SECRET", "\"${System.getenv("SPOTIFY_CLIENT_SECRET") ?: localProperties.getProperty("spotify.clientSecret", "")}\""
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    packaging {
        resources.excludes += "DebugProbesKt.bin"
    }

    lint {
        warningsAsErrors true
        disable 'VectorPath', 'Overdraw', 'TypographyEllipsis', 'InvalidSetHasFixedSize', 'UnusedResources', 'IconXmlAndPng', 'IconLauncherShape', 'IconDipSize', 'IconDuplicatesConfig', 'IconLocation', 'IconDensities', 'IconDuplicates'
    }

}


repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    mavenCentral()
    google()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.4.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'org.videolan.android:libvlc-all:3.4.9'
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    kapt 'com.github.bumptech.glide:compiler:4.13.0'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation "androidx.core:core-ktx:$androidCoreKxtVersion"
    implementation "androidx.activity:activity-ktx:1.5.0"
    implementation "androidx.fragment:fragment-ktx:1.5.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation("com.squareup.okhttp3:okhttp:4.9.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.2")
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    //noinspection GradleDependency
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.zxing:core:3.4.1'


    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    implementation "androidx.room:room-rxjava3:$roomVersion"
    implementation "androidx.room:room-guava:$roomVersion"
    testImplementation "androidx.room:room-testing:$roomVersion"


}

apply from: 'capacitor.build.gradle'
