name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release if the package.json version tag is missing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    name: Web build + tests + LOC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint:loc
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android-debug:
    name: Android debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SonicSound-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  android-unsigned-release:
    name: Unsigned release APK (F-Droid style)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble unsigned release
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SonicSound-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # On main: if package.json version was bumped and no tag exists yet, publish a release.
  # Manual: workflow_dispatch with publish_release=true publishes when the tag is missing.
  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: [web, android-debug, android-unsigned-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          BUMPED=false
          if [ "${FORCE_RELEASE}" = "true" ]; then
            BUMPED=true
          elif [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BUMPED=true
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            OLD=$(git show "${BEFORE_SHA}:package.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")
            if [ "$OLD" != "$VERSION" ]; then
              BUMPED=true
            fi
          else
            # before SHA unavailable (force-push / shallow history) — fall back to tag check only
            BUMPED=true
          fi

          if [ "$BUMPED" != true ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "package.json version unchanged; skipping release"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping release"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Will publish ${TAG} (event=${EVENT_NAME})"

      - name: Download build artifacts
        if: steps.bump.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        if: steps.bump.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          mkdir -p release-assets
          find artifacts -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            base=$(basename "$apk")
            case "$base" in
              *debug*) dest="SonicSound-${VERSION}-debug.apk" ;;
              *release*) dest="SonicSound-${VERSION}-release-unsigned.apk" ;;
              *) dest="SonicSound-${VERSION}-${base}" ;;
            esac
            cp "$apk" "release-assets/${dest}"
          done
          ls -la release-assets

      - name: Changelog notes for this version
        if: steps.bump.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 == "# " ver {flag=1; next}
            /^# / {flag=0}
            flag {print}
          ' docs/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "SonicSound ${VERSION}" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.bump.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: SonicSound ${{ steps.bump.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true

  # Manual / tag-push path: signed Play-style APK when keystore secrets are configured.
  android-signed-release:
    name: Android signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE secret; skipping signed assemble"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Assemble release
        if: steps.keystore.outputs.present == 'true'
        env:
          SONICSOUND_KEYSTORE: ${{ github.workspace }}/android/app/release.jks
          SONICSOUND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SONICSOUND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SONICSOUND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/SonicSound-${GITHUB_REF_NAME}.apk"
      - name: Upload signed APK to release
        if: steps.keystore.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          fail_on_unmatched_files: true
