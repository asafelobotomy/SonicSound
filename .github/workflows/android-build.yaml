name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web build + tests + LOC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint:loc
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android-debug:
    name: Android debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SonicSound-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  android-unsigned-release:
    name: Unsigned release APK (F-Droid style)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble unsigned release
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SonicSound-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  android-release:
    name: Android release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE != '' }}
        uses: timheuer/base64-to-file@v1
        with:
          fileName: android/app/release.jks
          encodedString: ${{ secrets.KEYSTORE }}
      - name: Assemble release
        env:
          SONICSOUND_KEYSTORE: ${{ github.workspace }}/android/app/release.jks
          SONICSOUND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SONICSOUND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SONICSOUND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/SonicSound-${{ github.ref_name }}.apk || \
            cp app/build/outputs/apk/release/*.apk out/SonicSound-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          body_path: docs/CHANGELOG.md
